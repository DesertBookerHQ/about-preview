server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This container sits behind another nginx (react-app:80). Keep redirects
    # relative so nginx never writes its own host/port into a Location header.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite build output: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML entry points must always be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
